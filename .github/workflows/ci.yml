name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      on_main: ${{ steps.tag.outputs.on_main }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Release tag must start with v and contain only letters, numbers, dots, underscores, or hyphens." >&2
            exit 1
          fi

          version_name="$(sed -n 's/^[[:space:]]*val appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version_name" || "$tag" != "v$version_name" ]]; then
            echo "Tag $tag does not match app version v$version_name." >&2
            exit 1
          fi
          echo "version=$version_name" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $tag is not on main; skipping the build and the release."
          fi

  build:
    name: Build APK
    needs: check
    if: always() && (needs.check.result == 'skipped' || needs.check.outputs.on_main == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_IS_PR_BUILD: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "Missing signing secret: $key" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          {
            printf 'ORG_GRADLE_PROJECT_KEYSTORE_FILE=%s\n' "$KEYSTORE_FILE"
            printf 'ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'ORG_GRADLE_PROJECT_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'ORG_GRADLE_PROJECT_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Explain PR signing
        if: github.event_name == 'pull_request'
        run: echo "::notice::PR builds are signed with the debug key."

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/release/Dao-*.apk
          archive: false
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    if: needs.check.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: Dao-${{ needs.check.outputs.version }}.apk

      - name: Attest release APK
        uses: actions/attest@v4
        with:
          subject-path: Dao-*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: Dao-*.apk
          fail_on_unmatched_files: true
          overwrite_files: false
