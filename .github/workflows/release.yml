name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "例如 v0.0.3"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Release tag must start with v and contain only letters, numbers, dots, underscores, or hyphens." >&2
            exit 1
          fi

          if ! git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG does not exist in this repository." >&2
            exit 1
          fi

          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version_name" || "$RELEASE_TAG" != "v$version_name" ]]; then
            echo "Tag $RELEASE_TAG does not match app version v$version_name." >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > dao-release.jks
          {
            printf 'storeFile=dao-release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Run local verification
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:jacocoDebugUnitTestReport
          :app:compileDebugAndroidTestKotlin
          :app:lintDebug

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dao-release-reports-${{ env.RELEASE_TAG }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/jacoco/jacocoDebugUnitTestReport/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

      - name: Attest release APK
        uses: actions/attest@v4
        with:
          subject-path: app/build/outputs/apk/release/Dao-*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/Dao-*.apk
          fail_on_unmatched_files: true
          overwrite_files: false
