name: Nightly

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'skills-lock.json'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_IS_PR_BUILD: ${{ github.event_name == 'pull_request' }}
      ORG_GRADLE_PROJECT_SIGNING_PROFILE: pr
      ORG_GRADLE_PROJECT_KEY_ALIAS: pr-key

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Generate temporary CI keystore
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: ${{ runner.temp }}/pr-key.jks
        run: |
          KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          export KEYSTORE_PASSWORD KEY_PASSWORD
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          keytool -genkeypair -noprompt \
            -alias "$ORG_GRADLE_PROJECT_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 1 \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -dname "CN=Dao CI Build" \
            -storetype JKS \
            -keystore "$ORG_GRADLE_PROJECT_KEYSTORE_FILE"

          {
            printf 'ORG_GRADLE_PROJECT_KEYSTORE_FILE=%s\n' "$ORG_GRADLE_PROJECT_KEYSTORE_FILE"
            printf 'ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'ORG_GRADLE_PROJECT_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --build-cache

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/Dao-*.apk
          if-no-files-found: error
          retention-days: 7
          archive: false
