name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "例如 v0.0.3"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Gate the release on the tag being reachable from main. Pushing a tag on a
  # side branch must not publish a release, so this job only reports ancestry
  # and the release job below is skipped when the tag is not on main.
  check:
    name: Check tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    outputs:
      on_main: ${{ steps.ancestry.outputs.on_main }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Check the tag
        id: ancestry
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $RELEASE_TAG is not on main; skipping the release build."
          fi

  release:
    name: Build and publish release
    needs: check
    if: needs.check.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ORG_GRADLE_PROJECT_IS_PR_BUILD: "false"
      ORG_GRADLE_PROJECT_SIGNING_PROFILE: release
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_FILE: ${{ github.workspace }}/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Release tag must start with v and contain only letters, numbers, dots, underscores, or hyphens." >&2
            exit 1
          fi

          if ! git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG does not exist in this repository." >&2
            exit 1
          fi

          version_name="$(sed -n 's/^[[:space:]]*val appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version_name" || "$RELEASE_TAG" != "v$version_name" ]]; then
            echo "Tag $RELEASE_TAG does not match app version v$version_name." >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare release signing
        run: |
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "Missing release signing secret: RELEASE_$key" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Attest release APK
        uses: actions/attest@v4
        with:
          subject-path: app/build/outputs/apk/release/Dao-*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/Dao-*.apk
          fail_on_unmatched_files: true
          overwrite_files: false
